<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="styles.css" />
    <script type="module" src="crud.js">
        import { getPosts } from "./crud.js";
    </script>
    <title>CRUD without frameworks</title>
</head>

<body>
    <h1 class="title"> CRUD with plain js</h1>
    <div>
        <form>
            <p>
                Create Data:
            </p>
            <input type="text" placeholder="Title" id="Ctitle">
            <input type="number" placeholder="Views" id="Cviews">
            <button type="submit" id="Cbutton">Create data</button>
            <!-- Read data  -->
            <p class="Rdata">
                Read data:
            </p>
            <button type="button" id="get-values">Read all the data</button>
            <script type="module" src="./app.js"></script>
            <ul id="rdata">

            </ul>
            <!-- Update data  -->
            <p class="Udata">
                Update data:
            </p>
            <button type="button" id="get-values-update">Update an entry</button>
            <script type="module" src="./app.js"></script>
            <ul id="Udata">

            </ul>
            <!-- Delete data  -->
            <p class="Ddata">
                Delete data:
            </p>
            <button type="button" id="get-values-delete">Delete an entry</button>
            <script type="module" src="./app.js"></script>
            <ul id="ddata">

            </ul>
        </form>
    </div>
</body>

</html>
